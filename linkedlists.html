<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linked Lists — Interview Prep</title>
<style>
  :root {
    --bg-page: #e8e8e6;
    --bg-sidebar: #dfdfdc;
    --bg-content: #eeeeec;
    --bg-code: #dcdcd9;
    --border: #cfcfcb;
    --border-light: #d5d5d2;
    --text-primary: #2c2c2a;
    --text-secondary: #68675f;
    --text-muted: #8a8980;
    --accent: #6b5ca8;
    --accent-light: #d2c4ec;
    --accent-border: #a89bd6;
    --easy-bg: #d3e8da;
    --easy-text: #25623f;
    --medium-bg: #f3e2c4;
    --medium-text: #8a5a12;
    --hard-bg: #f2d6d1;
    --hard-text: #96311f;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    margin: 0;
    padding: 0;
    line-height: 1.6;
  }

  .app {
    display: flex;
    min-height: 100vh;
    max-width: 1100px;
    margin: 0 auto;
  }

  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 24px 14px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .sidebar-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--accent);
    padding: 0 10px 4px;
    text-transform: uppercase;
  }

  .sidebar-sub {
    font-size: 12px;
    color: var(--text-muted);
    padding: 0 10px 16px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 10px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    margin-bottom: 2px;
    border-left: 2px solid transparent;
    transition: background 0.15s ease;
  }

  .nav-item:hover {
    background: rgba(107, 92, 168, 0.08);
  }

  .nav-item.active {
    background: var(--accent-light);
    color: var(--text-primary);
    border-left: 2px solid var(--accent);
    font-weight: 500;
  }

  .nav-item .num {
    font-size: 11px;
    color: var(--text-muted);
    min-width: 14px;
  }

  .nav-item.active .num {
    color: var(--accent);
  }

  .nav-divider {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }

  .nav-group-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 10px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    cursor: pointer;
    border-radius: 6px;
  }

  .nav-group-header:hover {
    background: rgba(107, 92, 168, 0.08);
  }

  .chevron {
    font-size: 10px;
    color: var(--text-muted);
  }

  .nav-group-list {
    padding-left: 8px;
  }

  .content-area {
    flex: 1;
    background: var(--bg-content);
    padding: 36px 44px;
    min-width: 0;
  }

  .problem-panel {
    display: none;
    max-width: 640px;
  }

  .problem-panel.active {
    display: block;
  }

  .problem-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .problem-title {
    font-size: 21px;
    font-weight: 600;
    margin: 0;
  }

  .problem-num {
    color: var(--accent);
    font-weight: 500;
  }

  .difficulty {
    font-size: 11px;
    padding: 3px 11px;
    border-radius: 20px;
    font-weight: 500;
  }

  .difficulty.easy { background: var(--easy-bg); color: var(--easy-text); }
  .difficulty.medium { background: var(--medium-bg); color: var(--medium-text); }
  .difficulty.hard { background: var(--hard-bg); color: var(--hard-text); }

  .section-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 22px 0 8px;
    font-weight: 600;
  }

  .section-label:first-of-type {
    margin-top: 16px;
  }

  .statement {
    font-size: 15px;
    color: var(--text-primary);
  }

  .example {
    background: var(--bg-code);
    border-radius: 6px;
    padding: 12px 14px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 8px;
    white-space: pre-wrap;
  }

  .summary {
    font-size: 15px;
    color: var(--text-primary);
  }

  .approach ol {
    margin: 0;
    padding-left: 20px;
  }

  .approach li {
    margin-bottom: 6px;
    font-size: 15px;
  }

  .toggle-row {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }

  .toggle-btn {
    background: transparent;
    border: 1px solid var(--accent-border);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .toggle-btn:hover {
    background: var(--accent-light);
  }

  .toggle-btn.active {
    background: var(--accent);
    color: #f2ede0;
    border-color: var(--accent);
  }

  .hidden-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }

  .hidden-content.open {
    max-height: 2000px;
  }

  pre.code-block {
    background: var(--bg-code);
    border-radius: 6px;
    padding: 16px;
    overflow-x: auto;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    margin: 12px 0 0;
  }

  code { color: var(--text-primary); }

  .complexity-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 12px;
  }

  .complexity-item {
    background: var(--bg-code);
    border-radius: 6px;
    padding: 12px 14px;
  }

  .complexity-tag {
    font-family: "SF Mono", Consolas, monospace;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .complexity-reason {
    font-size: 13px;
    color: var(--text-secondary);
  }

  @media (max-width: 700px) {
    .app { flex-direction: column; }
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
      display: flex;
      overflow-x: auto;
      padding: 12px;
      gap: 4px;
    }
    .sidebar-title, .sidebar-sub, .nav-divider { display: none; }
    .nav-item { white-space: nowrap; margin-bottom: 0; }
    .content-area { padding: 24px 20px; }
    .complexity-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="sidebar">
    <div class="sidebar-title">Topic 3 / 9</div>
    <div class="sidebar-sub">Linked Lists</div>
    <div id="navList"></div>
  </div>

  <div class="content-area" id="contentArea"></div>

</div>

<script>
const concepts = [
  {
    id: "c1",
    title: "Node Structure & Traversal Basics",
    html: `
      <div class="statement">A linked list is a chain of nodes, where each node holds a value and a pointer to the next node. Unlike arrays, there's no index — you can only reach a node by following pointers from the head, one step at a time.</div>
      <div class="section-label">Basic node shape</div>
      <pre class="code-block"><code>class ListNode {
    constructor(val, next = null) {
        this.val = val;
        this.next = next;
    }
}</code></pre>
      <div class="section-label">Why you can't index like an array</div>
      <div class="statement">There's no nums[i] equivalent — to reach the 5th node, you must traverse from head through nodes 1 through 4 first. This is why many linked list problems are O(n) just to reach a position, even before doing any real work.</div>
      <div class="section-label">Basic traversal pattern</div>
      <pre class="code-block"><code>let current = head;
while (current !== null) {
    console.log(current.val);
    current = current.next;
}</code></pre>
    `
  },
  {
    id: "c2",
    title: "Fast & Slow Pointers",
    html: `
      <div class="statement">Two pointers move through the list at different speeds — usually slow moves one step at a time, fast moves two steps at a time. This is the core technique for cycle detection and finding midpoints.</div>
      <div class="section-label">Why this detects cycles</div>
      <div class="statement">If there's a cycle, fast will eventually "lap" slow and they'll land on the same node. If there's no cycle, fast reaches the end (null) before that can happen.</div>
      <div class="section-label">Pattern</div>
      <pre class="code-block"><code>let slow = head;
let fast = head;

while (fast !== null && fast.next !== null) {
    slow = slow.next;
    fast = fast.next.next;
    if (slow === fast) {
        // cycle detected
    }
}</code></pre>
      <div class="section-label">Why the while condition checks both fast and fast.next</div>
      <div class="statement">fast moves two steps per iteration, so before accessing fast.next.next, you must confirm both fast and fast.next exist — otherwise you'd try to read .next on null and crash.</div>
    `
  },
  {
    id: "c3",
    title: "The Dummy Node Technique",
    html: `
      <div class="statement">A dummy (placeholder) node is created before the real head, so you always have a stable starting point to return from — especially useful when the head itself might change or get removed.</div>
      <div class="section-label">Why it helps</div>
      <div class="statement">Without a dummy node, removing or changing the head requires special-case code ("if this is the head, do X, otherwise do Y"). With a dummy node in front, every real node — including the original head — can be treated the same way.</div>
      <div class="section-label">Pattern</div>
      <pre class="code-block"><code>const dummy = new ListNode(0, head);
let current = dummy;
// ... do work, modifying current.next as needed ...
return dummy.next; // the real head, whatever it ended up being</code></pre>
    `
  },
  {
    id: "c4",
    title: "Reversing Links: Order Matters",
    html: `
      <div class="statement">Reversing a linked list means flipping each node's .next pointer to point backward instead of forward. The tricky part: once you change a node's .next, you lose the ability to move forward from it — so you must save a reference to the next node before overwriting the pointer.</div>
      <div class="section-label">The three-pointer shuffle</div>
      <div class="approach">
        <ol>
          <li>prev — tracks the previous node (starts as null)</li>
          <li>current — the node you're currently reversing</li>
          <li>next — saved reference to current.next, before it gets overwritten</li>
        </ol>
      </div>
      <div class="section-label">Why save "next" first</div>
      <div class="statement">If you set current.next = prev before saving the original current.next, you'd permanently lose the rest of the list — there'd be no way to move forward anymore.</div>
    `
  }
];

const problems = [
  {
    id: "p1",
    num: 1,
    title: "Reverse Linked List",
    difficulty: "easy",
    statement: "Given the head of a singly linked list, reverse the list and return the new head.",
    example: "Input: head = [1,2,3,4,5]\nOutput: [5,4,3,2,1]",
    summary: "Walk through the list, flipping each node's next pointer to point backward, using three tracking variables.",
    approach: [
      "Initialize prev = null (nothing comes before the new tail)",
      "Initialize current = head",
      "While current is not null:",
      "Save next = current.next (before overwriting it)",
      "Reverse the pointer: current.next = prev",
      "Move prev forward to current, then move current forward to the saved next",
      "When current becomes null, prev is the new head — return it"
    ],
    code: `function reverseList(head) {
    let prev = null;
    let current = head;

    while (current !== null) {
        const next = current.next;
        current.next = prev;
        prev = current;
        current = next;
    }

    return prev;
}`,
    tc: "O(n)",
    tcReason: "each node is visited and its pointer flipped exactly once",
    sc: "O(1)",
    scReason: "only a fixed number of pointer variables are used, no extra structure scales with input"
  },
  {
    id: "p2",
    num: 2,
    title: "Merge Two Sorted Lists",
    difficulty: "easy",
    statement: "Given the heads of two sorted linked lists, merge them into one sorted list and return its head.",
    example: "Input: list1 = [1,2,4], list2 = [1,3,4]\nOutput: [1,1,2,3,4,4]",
    summary: "Use a dummy node to build the merged list, always attaching the smaller of the two current nodes.",
    approach: [
      "Create a dummy node to serve as a stable starting point",
      "Set current = dummy",
      "While both lists still have nodes: compare list1's and list2's current values",
      "Attach the smaller node to current.next, then advance that list's pointer",
      "Advance current to the newly attached node",
      "Once one list is exhausted, attach whatever remains of the other list directly",
      "Return dummy.next as the head of the merged list"
    ],
    code: `function mergeTwoLists(list1, list2) {
    const dummy = new ListNode(0);
    let current = dummy;

    while (list1 !== null && list2 !== null) {
        if (list1.val <= list2.val) {
            current.next = list1;
            list1 = list1.next;
        } else {
            current.next = list2;
            list2 = list2.next;
        }
        current = current.next;
    }

    current.next = list1 !== null ? list1 : list2;

    return dummy.next;
}`,
    tc: "O(m + n)",
    tcReason: "each node from both lists is visited and attached exactly once",
    sc: "O(1)",
    scReason: "reuses existing nodes rather than creating new ones; only pointers are used"
  },
  {
    id: "p3",
    num: 3,
    title: "Linked List Cycle",
    difficulty: "easy",
    statement: "Given the head of a linked list, determine if the list has a cycle in it — meaning some node's next pointer eventually points back to a previous node.",
    example: "Input: head = [3,2,0,-4], with a cycle back to node index 1\nOutput: true",
    summary: "Use fast and slow pointers (Floyd's algorithm) — if they ever meet, there's a cycle.",
    approach: [
      "Initialize slow = head, fast = head",
      "While fast and fast.next are both not null:",
      "Move slow one step forward",
      "Move fast two steps forward",
      "If slow and fast ever point to the same node, a cycle exists — return true",
      "If the loop ends naturally (fast or fast.next becomes null), there's no cycle — return false"
    ],
    code: `function hasCycle(head) {
    let slow = head;
    let fast = head;

    while (fast !== null && fast.next !== null) {
        slow = slow.next;
        fast = fast.next.next;

        if (slow === fast) {
            return true;
        }
    }

    return false;
}`,
    tc: "O(n)",
    tcReason: "in the worst case, fast pointer traverses the list at most twice before either reaching the end or meeting slow",
    sc: "O(1)",
    scReason: "only two pointers are used, no extra structure like a visited-set is needed"
  },
  {
    id: "p4",
    num: 4,
    title: "Remove Nth Node From End",
    difficulty: "medium",
    statement: "Given the head of a linked list, remove the nth node from the end of the list and return the head.",
    example: "Input: head = [1,2,3,4,5], n = 2\nOutput: [1,2,3,5]",
    summary: "Use two pointers with a gap of n between them, so when the front pointer reaches the end, the back pointer is right before the node to remove.",
    approach: [
      "Create a dummy node pointing to head (handles edge case of removing the head itself)",
      "Set fast = dummy, slow = dummy",
      "Move fast forward n+1 steps ahead (creating the gap)",
      "Move fast and slow forward together, one step at a time, until fast reaches null",
      "At this point, slow is positioned right before the node to remove",
      "Skip the target node: slow.next = slow.next.next",
      "Return dummy.next"
    ],
    code: `function removeNthFromEnd(head, n) {
    const dummy = new ListNode(0, head);
    let fast = dummy;
    let slow = dummy;

    for (let i = 0; i < n + 1; i++) {
        fast = fast.next;
    }

    while (fast !== null) {
        fast = fast.next;
        slow = slow.next;
    }

    slow.next = slow.next.next;

    return dummy.next;
}`,
    tc: "O(n)",
    tcReason: "single pass through the list total, despite using two pointers",
    sc: "O(1)",
    scReason: "only a fixed number of pointers are used, no extra structure scales with input"
  },
  {
    id: "p5",
    num: 5,
    title: "Reorder List",
    difficulty: "medium",
    statement: "Given the head of a singly linked list, reorder it in place so nodes alternate: first, last, second, second-to-last, and so on.",
    example: "Input: head = [1,2,3,4,5]\nOutput: [1,5,2,4,3]",
    summary: "Find the middle, reverse the second half, then merge the two halves by alternating nodes.",
    approach: [
      "Find the middle of the list using fast and slow pointers",
      "Split the list into two halves at the middle",
      "Reverse the second half of the list",
      "Merge the two halves by alternating nodes: one from the first half, one from the reversed second half",
      "Continue until all nodes are relinked in the new order"
    ],
    code: `function reorderList(head) {
    if (!head || !head.next) return;

    // Step 1: find middle
    let slow = head, fast = head;
    while (fast.next !== null && fast.next.next !== null) {
        slow = slow.next;
        fast = fast.next.next;
    }

    // Step 2: reverse second half
    let second = slow.next;
    slow.next = null;
    let prev = null;
    while (second !== null) {
        const next = second.next;
        second.next = prev;
        prev = second;
        second = next;
    }
    second = prev;

    // Step 3: merge two halves
    let first = head;
    while (second !== null) {
        const tmp1 = first.next;
        const tmp2 = second.next;
        first.next = second;
        second.next = tmp1;
        first = tmp1;
        second = tmp2;
    }
}`,
    tc: "O(n)",
    tcReason: "finding the middle, reversing, and merging are each a single O(n) pass",
    sc: "O(1)",
    scReason: "reverses and relinks existing nodes in place, no new list is created"
  },
  {
    id: "p6",
    num: 6,
    title: "Copy List with Random Pointer",
    difficulty: "medium",
    statement: "A linked list has each node containing an extra random pointer that can point to any node in the list, or null. Create a deep copy of the list.",
    example: "Input: head = [[7,null],[13,0],[11,4],[10,2],[1,0]]\nOutput: a fully independent deep copy with matching val and random pointers",
    summary: "Use a hash map to link each original node to its copy, so random pointers can be correctly assigned in a second pass.",
    approach: [
      "First pass: traverse the original list, creating a copy of each node (val only, pointers unset)",
      "Store each mapping of original node to its copy in a hash map",
      "Second pass: traverse the original list again",
      "For each original node, set copy.next using the map (original.next's copy)",
      "Set copy.random using the map (original.random's copy, or null if original.random is null)",
      "Return the map's entry for the original head — the head of the copied list"
    ],
    code: `function copyRandomList(head) {
    if (!head) return null;

    const map = new Map();

    let current = head;
    while (current !== null) {
        map.set(current, new Node(current.val));
        current = current.next;
    }

    current = head;
    while (current !== null) {
        const copy = map.get(current);
        copy.next = current.next ? map.get(current.next) : null;
        copy.random = current.random ? map.get(current.random) : null;
        current = current.next;
    }

    return map.get(head);
}`,
    tc: "O(n)",
    tcReason: "two separate passes through the list, each visiting every node once",
    sc: "O(n)",
    scReason: "hash map stores one entry per original node to track original-to-copy mappings"
  }
];

const navList = document.getElementById('navList');
const contentArea = document.getElementById('contentArea');

const conceptsGroup = document.createElement('div');
conceptsGroup.className = 'nav-group-header';
conceptsGroup.innerHTML = `<span class="chevron">▸</span><span>Concepts</span>`;
navList.appendChild(conceptsGroup);

const conceptsList = document.createElement('div');
conceptsList.className = 'nav-group-list';
conceptsList.style.display = 'none';

concepts.forEach(c => {
  const navItem = document.createElement('div');
  navItem.className = 'nav-item concept-item';
  navItem.dataset.id = c.id;
  navItem.innerHTML = `<span>${c.title}</span>`;
  conceptsList.appendChild(navItem);
});

navList.appendChild(conceptsList);

conceptsGroup.addEventListener('click', () => {
  const isOpen = conceptsList.style.display !== 'none';
  conceptsList.style.display = isOpen ? 'none' : 'block';
  conceptsGroup.querySelector('.chevron').textContent = isOpen ? '▸' : '▾';
});

const conceptDivider = document.createElement('div');
conceptDivider.className = 'nav-divider';
navList.appendChild(conceptDivider);

problems.forEach(p => {
  const navItem = document.createElement('div');
  navItem.className = 'nav-item';
  navItem.dataset.id = p.id;
  navItem.innerHTML = `<span class="num">${p.num}.</span><span>${p.title}</span>`;
  navList.appendChild(navItem);
});

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

concepts.forEach(c => {
  const panel = document.createElement('div');
  panel.className = 'problem-panel';
  panel.id = 'panel-' + c.id;
  panel.innerHTML = `
    <div class="problem-header"><h2 class="problem-title">${c.title}</h2></div>
    ${c.html}
  `;
  contentArea.appendChild(panel);
});

problems.forEach(p => {
  const panel = document.createElement('div');
  panel.className = 'problem-panel';
  panel.id = 'panel-' + p.id;

  panel.innerHTML = `
    <div class="problem-header">
      <h2 class="problem-title"><span class="problem-num">#${p.num}</span> ${p.title}</h2>
      <span class="difficulty ${p.difficulty}">${p.difficulty}</span>
    </div>

    <div class="statement">${p.statement}</div>
    <div class="example">${p.example}</div>

    <div class="section-label">Summary</div>
    <div class="summary">${p.summary}</div>

    <div class="section-label">Approach</div>
    <div class="approach">
      <ol>${p.approach.map(step => `<li>${step}</li>`).join('')}</ol>
    </div>

    <div class="toggle-row">
      <button class="toggle-btn" data-target="code-${p.id}" data-type="code">Show code</button>
      <button class="toggle-btn" data-target="complexity-${p.id}" data-type="complexity">Show complexity</button>
    </div>

    <div class="hidden-content" id="code-${p.id}">
      <div class="section-label">Code</div>
      <pre class="code-block"><code>${escapeHtml(p.code)}</code></pre>
    </div>

    <div class="hidden-content" id="complexity-${p.id}">
      <div class="section-label">Complexity</div>
      <div class="complexity-grid">
        <div class="complexity-item">
          <div class="complexity-tag">Time: ${p.tc}</div>
          <div class="complexity-reason">${p.tcReason}</div>
        </div>
        <div class="complexity-item">
          <div class="complexity-tag">Space: ${p.sc}</div>
          <div class="complexity-reason">${p.scReason}</div>
        </div>
      </div>
    </div>
  `;
  contentArea.appendChild(panel);
});

function selectProblem(id) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  document.querySelectorAll('.problem-panel').forEach(el => {
    el.classList.toggle('active', el.id === 'panel-' + id);
  });
}

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => selectProblem(item.dataset.id));
});

document.addEventListener('click', (e) => {
  if (e.target.classList.contains('toggle-btn')) {
    const btn = e.target;
    const targetId = btn.getAttribute('data-target');
    const target = document.getElementById(targetId);
    const isOpen = target.classList.contains('open');

    target.classList.toggle('open');
    btn.classList.toggle('active');

    if (btn.dataset.type === 'code') {
      btn.textContent = isOpen ? 'Show code' : 'Hide code';
    } else {
      btn.textContent = isOpen ? 'Show complexity' : 'Hide complexity';
    }
  }
});

selectProblem('p1');
</script>

</body>
</html>
