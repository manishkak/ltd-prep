<script>
const problems = [
  {
    id: "p1",
    num: 1,
    title: "Two Sum",
    difficulty: "easy",
    statement: "Given an array of integers and a target value, return the indices of the two numbers that add up to the target. Assume exactly one solution exists, and you cannot use the same element twice.",
    example: "Input: nums = [2, 7, 11, 15], target = 9\nOutput: [0, 1]\nExplanation: nums[0] + nums[1] = 2 + 7 = 9",
    summary: "Use a hash map to store seen values and their indices. For each element, check if its complement already exists.",
    approach: [
      "Create an empty hash map",
      "Iterate through the array",
      "For each number, calculate complement = target - current_num",
      "Check if complement exists in hash map",
      "If yes, return indices [hash_map[complement], current_index]",
      "If no, store current_num and its index in hash map",
      "Continue until pair found"
    ],
    code: `function twoSum(nums, target) {
    const map = new Map();
    for (let i = 0; i < nums.length; i++) {
        const complement = target - nums[i];
        if (map.has(complement)) {
            return [map.get(complement), i];
        }
        map.set(nums[i], i);
    }
    return [];
}`,
    tc: "O(n)",
    tcReason: "single pass through the array, hash map lookups are O(1)",
    sc: "O(n)",
    scReason: "hash map can store up to n key-value pairs"
  },
  {
    id: "p2",
    num: 2,
    title: "Valid Anagram",
    difficulty: "easy",
    statement: "Given two strings, determine if the second string is an anagram of the first — meaning it uses exactly the same characters with the same frequency, just rearranged.",
    example: "Input: s = \"anagram\", t = \"nagaram\"\nOutput: true\n\nInput: s = \"rat\", t = \"car\"\nOutput: false",
    summary: "Check if two strings are anagrams by comparing character frequencies using a hash map.",
    approach: [
      "If lengths differ, return false (can't be anagrams)",
      "Create hash map for first string (count each character)",
      "Iterate through second string and decrement counts",
      "If any character is missing or count would go below zero, return false",
      "If all counts return to zero, return true"
    ],
    code: `let str1 = 'aab', str2='abb'
isAnagram(str1, str2)
function isAnagram(str1, str2)
{
 const map = new Map();
 if(str1.length !== str2.length) {
 return false
}
 for(let char of str1) {
 map.set(char, (map.get(char) || 0 )+1)
}
 for(let char of str2) {
 if(map.get(char) < 1) return false
 map.set(char, map.get(char)-1)
}
return true
}`,
    tc: "O(n)",
    tcReason: "two linear passes, one over each string",
    sc: "O(n)",
    scReason: "hash map stores counts for up to n distinct characters"
  },
  {
    id: "p3",
    num: 3,
    title: "Contains Duplicate",
    difficulty: "easy",
    statement: "Given an array of integers, return true if any value appears at least twice, and false if every element is distinct.",
    example: "Input: nums = [1, 2, 3, 1]\nOutput: true\n\nInput: nums = [1, 2, 3, 4]\nOutput: false",
    summary: "Use a hash set to track values seen so far; a repeat means a duplicate exists.",
    approach: [
      "Create an empty hash set",
      "Iterate through the array",
      "If the element already exists in the set, return true",
      "Otherwise, add the element to the set",
      "If the loop completes with no match, return false"
    ],
    code: `function containsDuplicate(nums) {
    const seen = new Set();
    for (let num of nums) {
        if (seen.has(num)) return true;
        seen.add(num);
    }
    return false;
}`,
    tc: "O(n)",
    tcReason: "single pass through the array, Set lookups are O(1)",
    sc: "O(n)",
    scReason: "set can store up to n unique values"
  },
  {
    id: "p4",
    num: 4,
    title: "Majority Element",
    difficulty: "medium",
    statement: "Given an array of size n, return the element that appears more than ⌊n/2⌋ times. Assume the array always has a majority element.",
    example: "Input: nums = [2, 2, 1, 1, 1, 2, 2]\nOutput: 2",
    summary: "Find the element appearing more than n/2 times using a hash map frequency count.",
    approach: [
      "Create a hash map to count the frequency of each number",
      "Iterate through the array, incrementing the count for each number",
      "Track the element with the highest count seen so far",
      "If a count exceeds n/2, that element is the majority element",
      "Return the element with the highest count"
    ],
    code: `function majorityElement(nums) {
    const map = {};
    const threshold = nums.length / 2;

    for (let num of nums) {
        map[num] = (map[num] || 0) + 1;
        if (map[num] > threshold) {
            return num;
        }
    }
}`,
    tc: "O(n)",
    tcReason: "single pass through the array with O(1) hash map updates",
    sc: "O(n)",
    scReason: "hash map can store counts for up to n distinct values"
  },
  {
    id: "p5",
    num: 5,
    title: "Group Anagrams",
    difficulty: "medium",
    statement: "Given an array of strings, group the strings that are anagrams of each other into sublists. Return the groups in any order.",
    example: "Input: strs = [\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"]\nOutput: [[\"eat\",\"tea\",\"ate\"],[\"tan\",\"nat\"],[\"bat\"]]",
    summary: "Group words that are anagrams by using their sorted-character form as a shared hash map key.",
    approach: [
      "Create a hash map with sorted strings as keys",
      "For each word, sort its characters to get its canonical form",
      "Add the original word to the list stored under that canonical key",
      "Return all groups (the values of the hash map)"
    ],
    code: `function groupAnagrams(strs) {
    const map = {};

    for (let str of strs) {
        const sorted = str.split('').sort().join('');
        if (!map[sorted]) {
            map[sorted] = [];
        }
        map[sorted].push(str);
    }

    return Object.values(map);
}`,
    tc: "O(n · k log k)",
    tcReason: "n strings, each sorted in O(k log k) where k is string length",
    sc: "O(n · k)",
    scReason: "hash map stores every original string across all groups"
  },
  {
    id: "p6",
    num: 6,
    title: "Longest Substring Without Repeating Characters",
    difficulty: "medium",
    statement: "Given a string, find the length of the longest substring that contains no repeating characters.",
    example: "Input: s = \"abcabcbb\"\nOutput: 3\nExplanation: the answer is \"abc\", with length 3.",
    summary: "Use a hash map plus a sliding window to track the last seen position of each character and find the longest valid window.",
    approach: [
      "Create a hash map to store the last seen index of each character",
      "Use two pointers: left and right, both starting at 0",
      "Expand the window by moving right one step at a time",
      "If the character at right was seen before and is inside the current window, move left just past that previous occurrence",
      "Update the character's last seen index to right",
      "Track the maximum window size (right - left + 1) seen so far",
      "Return the maximum length"
    ],
    code: `function lengthOfLongestSubstring(s) {
    const map = {};
    let left = 0;
    let maxLen = 0;

    for (let right = 0; right < s.length; right++) {
        if (map[s[right]] !== undefined && map[s[right]] >= left) {
            left = map[s[right]] + 1;
        }
        map[s[right]] = right;
        maxLen = Math.max(maxLen, right - left + 1);
    }

    return maxLen;
}`,
    tc: "O(n)",
    tcReason: "left and right pointers each move forward at most n times total",
    sc: "O(min(n, m))",
    scReason: "hash map stores at most one entry per distinct character (m = alphabet size)"
  },
  {
    id: "bonus1",
    num: null,
    title: "Three Sum",
    difficulty: "medium",
    bonus: true,
    statement: "Given an array of integers, find all unique triplets [a, b, c] such that a + b + c = 0. The solution set must not contain duplicate triplets.",
    example: "Input: nums = [-1, 0, 1, 2, -1, -4]\nOutput: [[-1, -1, 2], [-1, 0, 1]]",
    summary: "Sort the array, then fix one number and use two pointers to find pairs that sum to its negative — a variant that layers two pointers on top of the Two Sum idea.",
    approach: [
      "Sort the array first",
      "Loop through the array, fixing one number at index i (skip duplicates for i)",
      "Set left = i + 1, right = end of array",
      "While left < right: check if nums[i] + nums[left] + nums[right] equals 0",
      "If sum is 0, record the triplet, then move both pointers inward (skip duplicates)",
      "If sum is too small, move left forward; if too large, move right backward",
      "Continue until all triplets are found"
    ],
    code: `function threeSum(nums) {
    nums.sort((a, b) => a - b);
    const result = [];

    for (let i = 0; i < nums.length - 2; i++) {
        if (i > 0 && nums[i] === nums[i - 1]) continue;

        let left = i + 1;
        let right = nums.length - 1;

        while (left < right) {
            const sum = nums[i] + nums[left] + nums[right];
            if (sum === 0) {
                result.push([nums[i], nums[left], nums[right]]);
                while (left < right && nums[left] === nums[left + 1]) left++;
                while (left < right && nums[right] === nums[right - 1]) right--;
                left++;
                right--;
            } else if (sum < 0) {
                left++;
            } else {
                right--;
            }
        }
    }

    return result;
}`,
    tc: "O(n²)",
    tcReason: "sorting is O(n log n), then one outer loop with a two-pointer inner scan gives O(n²) overall",
    sc: "O(1)",
    scReason: "excluding the output array, only a constant number of pointers are used (sort may use O(log n) internally)"
  }
];

    title: "Overview & Complexity",
    html: `
      <div class="statement">Hash maps are foundational for counting, frequency, and lookup problems. They store key-value pairs with O(1) average lookup, insert, and delete.</div>
      <div class="section-label">Complexity summary</div>
      <div class="complexity-grid" style="grid-template-columns: 1fr 1fr;">
        <div class="complexity-item"><div class="complexity-tag">Insert / Delete</div><div class="complexity-reason">O(1) average, O(n) worst case</div></div>

      </div>
      <div class="section-label">Why "average" not always O(1)</div>
      <div class="statement">Engines track a <strong>load factor</strong> (how full the internal bucket array is). Once it crosses a threshold, the engine <strong>resizes and rehashes</strong> everything into a bigger array — this is what keeps collisions rare in practice, so O(1) average holds almost all the time. Worst case (O(n)) only shows up with a poor hash function or adversarially crafted keys.</div>
    `
  },
  {
    id: "c2",
    title: "Map vs Set vs Object",
    html: `
      <div class="statement">All three can store data by key, but they solve different problems.</div>
      <div class="section-label">Decision guide</div>
      <div class="approach">
        <ul style="margin:0; padding-left:20px;">
          <li><strong>Set</strong> — you only care about uniqueness, no associated value needed.</li>
          <li><strong>Map</strong> — key-value pairs, any key type, guaranteed insertion order, needs <code>.size</code> or clean iteration.</li>
          <li><strong>Object</strong> — fine for simple string-keyed data, but Map is generally preferred in interviews.</li>
        </ul>
      </div>
      <div class="section-label">A gotcha worth knowing</div>
      <div class="statement">Object keys are always stringified — <code>obj[1]</code> and <code>obj["1"]</code> collide as the same key. Map keeps key types distinct, so <code>map.set(1, "a")</code> and <code>map.set("1", "b")</code> are two separate entries.</div>
      <div class="section-label">Map equality nuance</div>
      <div class="statement">Map uses <strong>SameValueZero</strong> equality — meaning <code>NaN</code> is treated as equal to itself as a key (unlike <code>===</code>, where <code>NaN === NaN</code> is false). Rarely tested, but a sharp interviewer may probe it.</div>
    `
  },

    title: "Looping Patterns",
    html: `
      <div class="section-label">Object</div>
      <pre class="code-block"><code>for (const key in obj) { console.log(key, obj[key]); }

  {

    title: "Collision Handling",
    html: `
      <div class="section-label">How set() works internally</div>
      <div class="approach">
        <ol>
          <li>Key is hashed — "apple" -> hash function -> 42 (same input always gives the same number)</li>
          <li>Hash maps to a bucket/slot index -> bucket 42 (a slot in the internal storage array)</li>
          <li>The engine (V8, etc.) stores key + value together at that bucket -> <code>bucket[42] = {key: "apple", value: 10}</code></li>
        </ol>
      </div>
      <div class="section-label">What is a collision?</div>
      <div class="statement">Two different keys hash to the same index — e.g. "apple" and "grape" both hash to index 42.</div>
      <div class="section-label">Collision handling strategies</div>
      <div class="complexity-grid" style="grid-template-columns: 1fr 1fr;">
        <div class="complexity-item"><div class="complexity-tag">Chaining</div><div class="complexity-reason">Each bucket holds a list; collisions get appended. index 42 -> [("apple",10), ("grape",20)]</div></div>
        <div class="complexity-item"><div class="complexity-tag">Open addressing</div><div class="complexity-reason">If slot taken, probe next empty slot. 42 full -> try 43 -> then 44...</div></div>
      </div>
      <div class="statement">Which strategy is used is decided by the JS engine internally — not something you control.</div>
      <div class="section-label">Interview-safe answer</div>
      <div class="statement">"Internally, collisions are handled using techniques like chaining or open addressing depending on the implementation, so multiple keys can still be stored in the same hash bucket efficiently."</div>
    `
  },
  {
    id: "c6",
    title: "Two Sum: Sorted vs Unsorted",
    html: `
      <div class="statement">If sorted -> two pointers. O(1) space, no hash map needed — left/right pointers converge based on sum comparison.</div>
      <div class="statement" style="margin-top:8px;">If unsorted -> hash map. O(n) space, but O(n) time in one pass — sorting first would cost O(n log n), so hash map is faster than "sort then two-pointer" for an originally unsorted array.</div>
      <div class="statement" style="margin-top:8px;"><b>Map</b>: always O(n) time, O(n) space — works whether sorted or not 
        </br><b>Two pointers</b>: O(n) time, O(1) space — but only works if sorted.</div>
      <div class="section-label">Interview nuance</div>
      <div class="statement">If the problem asks for <strong>indices</strong> (like Two Sum), sorting destroys the original indices unless tracked separately — hash map is usually cleaner even if you could sort. If it asks for <strong>values</strong>, sorted + two pointers is very natural.</div>
      <div class="section-label">Combined approach</div>
      <pre class="code-block"><code>function twoSum(nums, target) {
    let isSorted = true;
    for (let i = 1; i < nums.length; i++) {
        if (nums[i] < nums[i - 1]) { isSorted = false; break; }
    }

    if (isSorted) {
        let left = 0, right = nums.length - 1;
        while (left < right) {
            let sum = nums[left] + nums[right];
            if (sum === target) return [left, right];
            else if (sum < target) left++;
            else right--;
        }
    } else {
        const map = new Map();
        for (let i = 0; i < nums.length; i++) {
            let complement = target - nums[i];
            if (map.has(complement)) {
                return [map.get(complement), i];
            }
            map.set(nums[i], i);
        }
    }
    return [];
}</code></pre>
    `
  }
];

const conceptsGroup = document.createElement('div');
conceptsGroup.className = 'nav-group-header';
conceptsGroup.innerHTML = `<span class="chevron">▸</span><span>Concepts</span>`;
navList.appendChild(conceptsGroup);

const conceptsList = document.createElement('div');
conceptsList.className = 'nav-group-list';
conceptsList.style.display = 'none';

concepts.forEach(c => {
  const navItem = document.createElement('div');
  navItem.className = 'nav-item concept-item';
  navItem.dataset.id = c.id;
  navItem.innerHTML = `<span>${c.title}</span>`;
  conceptsList.appendChild(navItem);
});

navList.appendChild(conceptsList);

conceptsGroup.addEventListener('click', () => {
  const isOpen = conceptsList.style.display !== 'none';
  conceptsList.style.display = isOpen ? 'none' : 'block';
  conceptsGroup.querySelector('.chevron').textContent = isOpen ? '▸' : '▾';
});

const conceptDivider = document.createElement('div');
conceptDivider.className = 'nav-divider';
navList.appendChild(conceptDivider);

concepts.forEach(c => {
  const panel = document.createElement('div');
  panel.className = 'problem-panel';
  panel.id = 'panel-' + c.id;
  panel.innerHTML = `
    <div class="problem-header"><h2 class="problem-title">${c.title}</h2></div>
    ${c.html}
  `;
  contentArea.appendChild(panel);
});

const coreProblems = problems.filter(p => !p.bonus);
const bonusProblems = problems.filter(p => p.bonus);

coreProblems.forEach(p => {
  const navItem = document.createElement('div');
  navItem.className = 'nav-item';
  navItem.dataset.id = p.id;
  navItem.innerHTML = `<span class="num">${p.num}.</span><span>${p.title}</span>`;
  navList.appendChild(navItem);
});

if (bonusProblems.length) {
  const divider = document.createElement('div');
  divider.className = 'nav-divider';
  navList.appendChild(divider);

  bonusProblems.forEach(p => {
    const navItem = document.createElement('div');
    navItem.className = 'nav-item bonus';
    navItem.dataset.id = p.id;
    navItem.innerHTML = `<span>${p.title}</span>`;
    navList.appendChild(navItem);
  });
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

problems.forEach(p => {
  const panel = document.createElement('div');
  panel.className = 'problem-panel';
  panel.id = 'panel-' + p.id;

  const titlePrefix = p.bonus ? '' : `<span class="problem-num">#${p.num}</span> `;
  const badge = p.bonus
    ? `<span class="bonus-tag">bonus variant</span>`
    : `<span class="difficulty ${p.difficulty}">${p.difficulty}</span>`;

  panel.innerHTML = `
    <div class="problem-header">
      <h2 class="problem-title">${titlePrefix}${p.title}</h2>
      ${badge}
      ${p.bonus ? `<span class="difficulty ${p.difficulty}">${p.difficulty}</span>` : ''}
    </div>

    <div class="statement">${p.statement}</div>
    <div class="example">${p.example}</div>

    <div class="section-label">Summary</div>
    <div class="summary">${p.summary}</div>

    <div class="section-label">Approach</div>
    <div class="approach">
      <ol>${p.approach.map(step => `<li>${step}</li>`).join('')}</ol>
    </div>

    <div class="toggle-row">
      <button class="toggle-btn" data-target="code-${p.id}" data-type="code">Show code</button>
      <button class="toggle-btn" data-target="complexity-${p.id}" data-type="complexity">Show complexity</button>
    </div>

    <div class="hidden-content" id="code-${p.id}">
      <div class="section-label">Code</div>
      <pre class="code-block"><code>${escapeHtml(p.code)}</code></pre>
    </div>

    <div class="hidden-content" id="complexity-${p.id}">
      <div class="section-label">Complexity</div>
      <div class="complexity-grid">
        <div class="complexity-item">
          <div class="complexity-tag">Time: ${p.tc}</div>
          <div class="complexity-reason">${p.tcReason}</div>
        </div>
        <div class="complexity-item">
          <div class="complexity-tag">Space: ${p.sc}</div>
          <div class="complexity-reason">${p.scReason}</div>
        </div>
      </div>
    </div>
  `;
  contentArea.appendChild(panel);
});

function selectProblem(id) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  document.querySelectorAll('.problem-panel').forEach(el => {
    el.classList.toggle('active', el.id === 'panel-' + id);
  });
}

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => selectProblem(item.dataset.id));
});

document.addEventListener('click', (e) => {
  if (e.target.classList.contains('toggle-btn')) {
    const btn = e.target;
    const targetId = btn.getAttribute('data-target');
    const target = document.getElementById(targetId);
    const isOpen = target.classList.contains('open');

    target.classList.toggle('open');
    btn.classList.toggle('active');

    if (btn.dataset.type === 'code') {
      btn.textContent = isOpen ? 'Show code' : 'Hide code';
    } else {
      btn.textContent = isOpen ? 'Show complexity' : 'Hide complexity';
    }
  }
});

selectProblem('c1');
</script>
